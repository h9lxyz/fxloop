<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FXLoop CSS inspector</title>
<style>
:root{
  --bg:#1e1f22;--panel:#25262a;--panel2:#2b2d31;--border:#3a3c42;--fg:#d4d4d8;--dim:#8b8d94;
  --type:#c586c0;--id:#e8a45c;--cls:#7fb1e8;--sel:#27456b;--hover:#2d2f35;--ok:#4ec36b;--bad:#e5534b;--warn:#e0b341;
  --accent:#5b9bf0;--prop:#9cdcfe;--val:#ce9178;--link:#7fb1e8;--chip:#33363d;
  --mb-margin:#5a4a2c;--mb-border:#4d4d4d;--mb-pad:#3f5a36;--mb-content:#2f4d66;--mb-fg:#eee;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#ffffff;--panel:#f3f3f5;--panel2:#ececef;--border:#d0d0d6;--fg:#222226;--dim:#6b6d75;
    --type:#a626a4;--id:#b45f06;--cls:#1a5fb4;--sel:#cfe0f7;--hover:#e8e8ec;--ok:#1e8e3e;--bad:#c5221f;--warn:#a06a00;
    --accent:#1a73e8;--prop:#0b5cad;--val:#a31515;--link:#1a5fb4;--chip:#e2e2e8;
    --mb-margin:#f9cc9d;--mb-border:#fddd9b;--mb-pad:#c3d08b;--mb-content:#8cb6c0;--mb-fg:#111;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
#toolbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
#toolbar h1{font-size:13px;margin:0 6px 0 0;font-weight:600}
#toolbar label{display:flex;align-items:center;gap:4px;cursor:pointer}
#dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}
#dot.on{background:var(--ok)}
#status{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:5px;margin-left:auto}
#updated{color:var(--ok);opacity:0;transition:opacity .6s}
#updated.flash{opacity:1;transition:none}
#hint{color:var(--warn)}
#banner{background:#5a2a2a;color:#ffd7d4;padding:6px 12px;display:none}
#lockbar{background:#5a4314;color:#ffe9b8;padding:6px 12px;display:none;align-items:center;gap:10px}
#lockbar button{margin-left:auto}
#agent{color:var(--warn)}
.plan{margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
.plan .f{font-weight:600;margin-top:4px}
.plan .c{margin-left:12px;white-space:pre-wrap}
.plan .c .k{color:var(--dim);margin-right:6px}
.plan .dest{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0 0 12px}
.plan .dest select{max-width:100%;min-width:0}
.plan .hint,.mapf .hint{margin:2px 0 0 12px;color:var(--dim);font-size:12px}
.plan .lib{color:var(--warn)}
.ext{font-size:10px;border:1px solid var(--border);border-radius:9px;padding:0 6px;color:var(--dim);white-space:nowrap;cursor:help}
.ext.mapped{border-color:var(--accent);color:var(--accent)}
.ext.warn{border-color:var(--warn);color:var(--warn)}
.linkb{border:0;background:none;color:var(--link);padding:0 4px;font-size:11px;text-decoration:underline dotted}
.mapf{margin:6px 0 2px 18px;padding:6px 8px;border:1px dashed var(--border);border-radius:4px;background:var(--panel)}
.mapf .chips input{flex:1 1 260px;min-width:0}
.mapf .sg{display:block;margin:2px 0 0 12px;cursor:pointer;color:var(--link);overflow-wrap:anywhere}
.mapf .sg:hover{text-decoration:underline}
.mapf .bad{color:var(--warn);margin-top:4px}
#main{flex:1;display:flex;min-height:0}
#treePane{width:42%;min-width:160px;overflow:auto;background:var(--bg);outline:none;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#split{width:5px;cursor:col-resize;background:var(--border);flex:none}
#split:hover{background:var(--accent)}
#stylesPane{flex:1;min-width:200px;overflow:auto;background:var(--bg)}
.row{display:flex;align-items:center;white-space:nowrap;height:20px;cursor:default;padding-right:8px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.tw{width:14px;flex:none;text-align:center;color:var(--dim);font-size:9px;cursor:pointer;user-select:none}
.t-type{color:var(--type)}.t-id{color:var(--id)}.t-cls{color:var(--cls)}.t-text{color:var(--dim);margin-left:8px}
.skin .t-type,.skin .t-id,.skin .t-cls{opacity:.55;font-style:italic}
.more{color:var(--dim);font-style:italic}
.err{margin:10px;padding:8px 10px;border:1px solid var(--bad);border-radius:4px;color:var(--bad);white-space:pre-wrap}
.empty{margin:14px;color:var(--dim)}
#stHead{padding:8px 10px;border-bottom:1px solid var(--border);background:var(--panel)}
#stHead .sum{font-weight:600}
.mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.chip{background:var(--chip);border-radius:9px;padding:0 7px;font-size:11px}
.chip.ps{color:var(--warn)}
.inl{margin-top:4px;color:var(--dim)}
#tabs{display:flex;gap:2px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--border);background:var(--panel)}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none}
#tabs button.on{border-bottom-color:var(--accent)}
#tabs input{margin-left:auto;width:170px}
.rule{border-bottom:1px solid var(--border);padding:6px 10px}
.rule .hd{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.rule .sel-t{color:var(--cls);flex:1 1 8em;overflow-wrap:anywhere}
.spec{background:var(--chip);border-radius:3px;padding:0 5px;font-size:11px;color:var(--dim)}
.org{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.loc{color:var(--link);cursor:pointer;text-decoration:underline dotted;white-space:nowrap}
.ide{margin-left:4px;text-decoration:none;color:var(--link)}
.decl{padding-left:18px;font:12px ui-monospace,Menlo,Consolas,monospace}
.decl .p{color:var(--prop)}.decl .v{color:var(--val)}
.decl.overridden{text-decoration:line-through;color:var(--dim)}
.decl.overridden .p,.decl.overridden .v{color:var(--dim)}
.imp{color:var(--warn);font-weight:600;display:inline-block}
.why{display:inline-block;text-decoration:none;color:var(--dim);margin-left:8px;font-family:system-ui,sans-serif;font-size:11px}
.sect{padding:6px 10px;background:var(--panel2);font-weight:600;border-bottom:1px solid var(--border)}
.sect .path{font-weight:400;color:var(--dim);font:11px ui-monospace,monospace}
.blk{border:1px solid var(--warn);border-radius:4px;margin:10px;padding:8px 10px}
.blk h3{margin:0 0 6px;font-size:12px;color:var(--warn)}
.blk .prop{margin-top:8px}
.blk .cause{margin-left:12px}.blk .next{margin-left:12px;color:var(--dim)}
.sugg{margin:6px 0 0 12px;padding:6px;background:var(--panel);border-radius:4px}
.sugg pre{margin:4px 0;padding:6px;background:var(--bg);border:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,Menlo,monospace}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:3px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:12px}
th{color:var(--dim);font-weight:500}
tr.mismatch td{background:rgba(229,83,75,.18);color:var(--bad)}
#box{padding:10px;border-top:1px solid var(--border)}
.mb{padding:6px 24px;text-align:center;font-size:11px;border:1px dashed var(--border);position:relative;color:var(--mb-fg)}
.mb.b{background:var(--mb-border)}.mb.p{background:var(--mb-pad)}.mb.c{background:var(--mb-content)}
.mb .lab{position:absolute;left:4px;top:1px;font-size:9px;opacity:.7}
.scratch{margin:8px 10px;padding:8px 10px;border:1px dashed var(--accent);border-radius:4px;background:var(--panel)}
.scratch .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.scratch .chips{margin-top:6px}
.newrule{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.newrule input{min-width:0;flex:1 1 110px}
.rule.scratch-rule{border-left:3px solid var(--accent)}
.rule.code-rule{border-left:3px solid var(--warn)}
.rule .note{margin:2px 0 4px 18px;color:var(--dim);font-size:11px}
.newrule .scope{align-self:center;font-size:11px;color:var(--dim);white-space:nowrap}
.newrule .scope.one{color:var(--ok)}.newrule .scope.warn{color:var(--warn)}
.newrule .selw{flex:1 1 140px;display:flex}.newrule .selw input{flex:1}
.cbar{display:flex;align-items:center;gap:6px;padding:6px 10px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--border)}
td .v{color:var(--val)}
tr.dflt td,tr.dflt td .v{color:var(--dim)}
td.src .org{margin-right:6px}
td .editable,.decl .v.editable{cursor:text;border-bottom:1px dotted transparent}
td .editable:hover{border-bottom-color:var(--val)}
.moredef{margin:8px 10px;color:var(--dim);font-size:12px}
.decl{position:relative}
.decl .editable{cursor:text;border-bottom:1px dotted transparent}
.decl .editable:hover{border-bottom-color:var(--val)}
.decl input.ed{font:inherit;padding:0 4px;width:16em;max-width:100%}
.tog{position:absolute;left:1px;top:3px;margin:0;width:12px;height:12px;cursor:pointer}
.x{border:0;background:none;color:var(--dim);padding:0 4px;margin-left:6px}
.x:hover{color:var(--bad)}
.vedit{display:inline-flex;align-items:center;gap:3px;position:relative;vertical-align:middle}
.vedit input.ed{width:auto;min-width:6ch}
input.ed.bad{border-color:var(--bad);color:var(--bad)}
.vbtn{padding:0 4px;font-size:10px;line-height:16px;color:var(--dim)}
.steps{display:inline-flex;flex-direction:column;gap:1px}
.steps button{padding:0 4px;font-size:8px;line-height:7px;height:9px;color:var(--dim)}
.vcolor{width:22px;height:18px;padding:0 1px;cursor:pointer}
.valpha{width:64px;padding:0;accent-color:var(--accent)}
.vpop{position:fixed;z-index:20;min-width:240px;max-width:440px;max-height:260px;overflow-x:hidden;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.35);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-decoration:none;color:var(--fg)}
.vpop .it{display:flex;align-items:center;gap:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.vpop .it>span:not(.tag):not(.sw){overflow:hidden;text-overflow:ellipsis}
.vpop .it.on{background:var(--sel)}
.vpop .it:hover{background:var(--hover)}
.vpop .tag{margin-left:auto;padding-left:12px;color:var(--dim);font:10px system-ui,sans-serif}
.vpop .foot{padding:3px 8px;color:var(--dim);font:10px system-ui,sans-serif;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--panel);white-space:normal}
.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--dim);border-radius:2px;margin:0 3px -1px 1px;vertical-align:baseline}
.sw.click{cursor:pointer}.sw.click:hover{outline:1px solid var(--accent)}
.decl.adddecl{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.decl.adddecl input.pn{font:inherit;padding:0 4px;width:16ch;color:var(--prop)}
.addb{border:0;background:none;color:var(--dim);padding:0 6px;font-size:13px;line-height:14px}
.addb:hover{color:var(--accent)}
.newrule .vedit{flex:1 1 160px}
.newrule .vedit input.ed{flex:1;width:100%}
#ask{border-top:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;max-height:45vh;flex:none}
#askLog{overflow:auto;max-height:28vh}
#askLog:empty{display:none}
.pm{padding:5px 10px;border-bottom:1px solid var(--border)}
.pm .meta{color:var(--dim);font-size:11px;display:flex;gap:8px;align-items:baseline}
.pm .meta .st{text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.pm .meta .st.pending{color:var(--warn)}.pm .meta .st.taken{color:var(--accent)}.pm .meta .st.answered{color:var(--ok)}
.pm .q{white-space:pre-wrap;margin-top:2px}
.pm .a{white-space:pre-wrap;margin:4px 0 0 2px;padding:3px 8px;border-left:2px solid var(--accent);background:var(--bg)}
.pm .a.note{border-left-color:var(--dim);color:var(--dim)}
#askBar{display:flex;gap:8px;align-items:center;padding:4px 10px 0;font-size:12px;color:var(--dim);flex-wrap:wrap}
#askCtx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#askCtx .about{color:var(--prop)}
#askListen{white-space:nowrap}#askListen.on{color:var(--ok)}
#askForm{display:flex;gap:6px;padding:4px 10px 8px;align-items:flex-end}
#askText{flex:1;resize:vertical;min-height:34px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px}
.decl .p.askable{cursor:pointer}.decl .p.askable:hover{text-decoration:underline dotted}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:6px 12px;border-radius:4px;display:none;z-index:9}
</style>
</head>
<body>
<div id="toolbar">
  <h1>FXLoop CSS inspector</h1>
  <button id="pick">Pick in app</button>
  <span id="hint"></span>
  <label><input type="checkbox" id="skin"> Show skin nodes</label>
  <select id="win" aria-label="Window"></select>
  <span id="agent"></span>
  <span id="status"><span id="updated">updated</span><span id="dot"></span><span id="stxt">connecting</span></span>
</div>
<div id="banner"></div>
<div id="lockbar" role="status"><span id="locktxt"></span><button id="takeover" title="Ends the agent's input lock so you can use the app and edit again">Take over</button></div>
<div id="main">
  <div id="treePane" tabindex="0" role="tree"></div>
  <div id="split"></div>
  <div id="stylesPane"></div>
</div>
<div id="ask" aria-label="Ask agent">
  <div id="askLog" aria-live="polite"></div>
  <div id="askBar"><span id="askCtx"></span><span id="askListen"></span></div>
  <form id="askForm"><textarea id="askText" rows="2" placeholder="Ask the agent about this node… (Ctrl+Enter sends; click a property name to ask about that declaration)"></textarea><button type="submit" id="askSend">Ask agent</button></form>
</div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var Q = new URLSearchParams(location.search);
var TOKEN = Q.get('t') || '';
var $ = function(id){ return document.getElementById(id); };

function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }

var state = {
  win: Q.get('window') ? parseInt(Q.get('window'),10) : 0,
  skin: false,
  root: null,
  expanded: Object.create(null),
  sel: (Q.get('h') || Q.get('path')) ? { h: Q.get('h') ? parseInt(Q.get('h'),10) : null, path: Q.get('path') || null } : null,
  styles: null, layout: null,
  tab: 'styles', filter: '',
  showDefaults: true,               // Computed lists properties no rule or code sets (dimmed); remembered per browser
  suggest: Object.create(null),
  rows: [],
  picking: false,
  scratch: null,                    // {active, rules, css, items} when FXLOOP_INSPECTOR_EDIT is on
  disabled: Object.create(null),    // "selector|property" toggled off through a scratch fallback rule
  newRule: false,
  draft: null,                      // {sel, prop, val} of the open new-rule form, kept across re-renders and errors
  editing: false,                   // a value editor is live-previewing: re-renders wait until it ends
  renderPending: false,
  plan: null,                       // Apply to file preview: {items, files:[{file, changes}]} from /api/scratch/apply?dryRun=1
  targets: Object.create(null),     // scratch rule n → stylesheet picked for it in that preview
  mapping: null,                    // open "Map to source" form: {url, anchor, sheet, value, suggestions, error}
  lock: null,                       // {reason?, remainingMs} while the agent holds the input lock (status event)
  activity: '',                     // what the agent is doing right now (status event)
  prompts: null,                    // {listening, items} of the Ask agent box (prompts event)
  askAbout: null                    // {property, selector, file, line} the next prompt is about
};

var DEFAULTS_KEY = 'fxloop.inspect.showDefaults';
try { state.showDefaults = localStorage.getItem(DEFAULTS_KEY) !== '0'; } catch(e){}

// ---------- API ----------
function api(path, params, method){
  var u = new URLSearchParams();
  Object.keys(params || {}).forEach(function(k){
    var v = params[k];
    if (v !== null && v !== undefined && v !== '') u.set(k, v);
  });
  u.set('t', TOKEN);
  return fetch(path + '?' + u.toString(), { method: method || 'GET', cache: 'no-store' }).then(asJson);
}
function asJson(r){
  return r.text().then(function(txt){
    var j;
    try { j = txt ? JSON.parse(txt) : {}; } catch(e){ throw { code: 'BAD_RESPONSE', message: 'HTTP ' + r.status + ' (not JSON)' }; }
    if (j && j.error) throw j.error;
    if (!r.ok) throw { code: 'HTTP_' + r.status, message: 'HTTP ' + r.status };
    return j;
  });
}
function postText(path, text){
  return fetch(path + '?t=' + encodeURIComponent(TOKEN), {
    method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'text/css; charset=utf-8' }, body: text
  }).then(asJson);
}
function postJson(path, body, params){
  var u = new URLSearchParams();
  Object.keys(params || {}).forEach(function(k){ u.set(k, params[k]); });
  u.set('t', TOKEN);
  return fetch(path + '?' + u.toString(), {
    method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(asJson);
}
function errText(e){
  if (e && e.code) return e.code + ': ' + (e.message || '');
  return String((e && e.message) || e);
}
// A page opened before the app attaches (or kept open across an app restart) gets NO_APP; it retries until the app is
// back, right away on the server's `status` event (pushed when an app connects) and on a slow timer as a fallback.
var noAppTimer = null;
function showBanner(e){
  var b = $('banner');
  if (e && e.code === 'NO_APP') {
    b.textContent = 'No app connected to the FXLoop server — waiting for the app to start…';
    b.style.display = 'block';
    if (!noAppTimer) noAppTimer = setInterval(retryApp, 3000);
  } else {
    b.style.display = 'none';
    if (noAppTimer) { clearInterval(noAppTimer); noAppTimer = null; }
  }
}
function retryApp(){
  if (!noAppTimer) return;
  loadWindows().then(function(){ if (!noAppTimer) reloadAll(); });
}
function paneError(pane, e){
  showBanner(e);
  clear(pane);
  pane.appendChild(el('div', 'err', errText(e)));
}

// ---------- toast / clipboard ----------
var toastTimer;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 1800);
}
function copy(text, msg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg || 'Copied'); } catch(e){ toast('Copy failed'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast(msg || 'Copied'); }, fallback);
  } else fallback();
}

// ---------- windows ----------
function loadWindows(){
  return api('/api/windows').then(function(j){
    var list = Array.isArray(j) ? j : (j.windows || []);
    var s = $('win'); clear(s);
    list.forEach(function(w, i){
      var idx = (w.index != null) ? w.index : i;
      var o = el('option', null, (w.title || w.type || 'window') + ' [' + idx + ']');
      o.value = String(idx);
      s.appendChild(o);
    });
    if (!list.length) { var o = el('option', null, 'no windows'); o.value = '0'; s.appendChild(o); }
    s.value = String(state.win);
    if (s.value !== String(state.win) && s.options.length) { s.selectedIndex = 0; state.win = parseInt(s.value, 10) || 0; }
    showBanner(null);
  }).catch(function(e){ showBanner(e); });
}

// ---------- tree ----------
function nkey(n){ return n.path || ('h' + n.h); }
function same(n, sel){
  if (!sel || !n) return false;
  if (sel.h != null && n.h === sel.h) return true;
  return sel.path != null && n.path === sel.path;
}
function findPath(n, sel, trail){
  if (!n || n.truncated) return null;
  trail.push(n);
  if (same(n, sel)) return trail;
  var ks = n.children || [];
  for (var i = 0; i < ks.length; i++) {
    var r = findPath(ks[i], sel, trail);
    if (r) return r;
  }
  trail.pop();
  return null;
}
function expandToSel(){
  if (!state.root || !state.sel) return;
  var tr = findPath(state.root, state.sel, []);
  if (!tr) return;
  for (var i = 0; i < tr.length - 1; i++) state.expanded[nkey(tr[i])] = true;
  var hit = tr[tr.length - 1];
  state.sel = { h: hit.h, path: hit.path || state.sel.path || null };
}
function loadTree(){
  var pane = $('treePane');
  return api('/api/tree', { window: state.win, skin: state.skin ? 1 : 0 }).then(function(j){
    showBanner(null);
    state.root = j.root || j;
    if (state.root && state.expanded[nkey(state.root)] === undefined) state.expanded[nkey(state.root)] = true;
    expandToSel();
    renderTree();
    scrollSelIntoView();
  }).catch(function(e){ state.root = null; state.rows = []; paneError(pane, e); });
}
function flatten(n, depth, out){
  out.push({ n: n, depth: depth });
  if (n.truncated) return;
  var ks = n.children || [];
  if (ks.length && state.expanded[nkey(n)]) ks.forEach(function(k){ flatten(k, depth + 1, out); });
}
function renderTree(){
  var pane = $('treePane'), top = pane.scrollTop;
  clear(pane);
  if (!state.root) return;
  var rows = []; flatten(state.root, 0, rows); state.rows = rows;
  var frag = document.createDocumentFragment();
  rows.forEach(function(r, idx){
    var n = r.n, row = el('div', 'row'); row.style.paddingLeft = (6 + r.depth * 14) + 'px';
    if (n.truncated) {
      row.appendChild(el('span', 'tw'));
      row.appendChild(el('span', 'more', '… ' + (n.kids != null ? n.kids : '?') + ' more'));
      frag.appendChild(row); return;
    }
    row.setAttribute('role', 'treeitem');
    if (n.skin) row.classList.add('skin');
    if (same(n, state.sel)) row.classList.add('sel');
    var hasKids = (n.children && n.children.length) || n.kids > 0;
    var tw = el('span', 'tw', hasKids ? (state.expanded[nkey(n)] ? '▼' : '▶') : '');
    tw.addEventListener('click', function(ev){ ev.stopPropagation(); toggle(n); });
    row.appendChild(tw);
    row.appendChild(el('span', 't-type', n.type || '?'));
    if (n.fxId) row.appendChild(el('span', 't-id', '#' + n.fxId));
    if (n.styleClass) row.appendChild(el('span', 't-cls', ' .' + String(n.styleClass).split(/\s+/).filter(Boolean).join('.')));
    if (n.text) row.appendChild(el('span', 't-text', '"' + n.text + '"'));
    row.addEventListener('click', function(){ select(n); });
    row.addEventListener('mouseenter', function(){ hoverHighlight(n); });
    frag.appendChild(row);
  });
  pane.appendChild(frag);
  pane.scrollTop = top;
}
function toggle(n){ state.expanded[nkey(n)] = !state.expanded[nkey(n)]; renderTree(); }
function scrollSelIntoView(){
  var s = document.querySelector('#treePane .row.sel');
  if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' });
}

// highlight
var hlTimer;
function hoverHighlight(n){
  clearTimeout(hlTimer);
  hlTimer = setTimeout(function(){
    api('/api/highlight', { h: n.h }, 'POST').catch(function(){});
  }, 80);
}
function clearHighlight(){
  clearTimeout(hlTimer);
  api('/api/highlight', { clear: 1 }, 'POST').catch(function(){});
}

// keyboard
function selIndex(){
  for (var i = 0; i < state.rows.length; i++) if (!state.rows[i].n.truncated && same(state.rows[i].n, state.sel)) return i;
  return -1;
}
function parentOf(idx){
  var d = state.rows[idx].depth;
  for (var i = idx - 1; i >= 0; i--) if (state.rows[i].depth < d) return i;
  return -1;
}
function onKey(ev){
  if (!state.rows.length) return;
  var i = selIndex(), n = i >= 0 ? state.rows[i].n : null, k = ev.key;
  function go(j, step){
    while (j >= 0 && j < state.rows.length && state.rows[j].n.truncated) j += step;
    if (j >= 0 && j < state.rows.length) { select(state.rows[j].n); hoverHighlight(state.rows[j].n); }
  }
  if (k === 'ArrowDown') { go(i + 1, 1); ev.preventDefault(); }
  else if (k === 'ArrowUp') { go(i < 0 ? 0 : i - 1, -1); ev.preventDefault(); }
  else if (k === 'ArrowRight' && n) {
    if (n.children && n.children.length && !state.expanded[nkey(n)]) { state.expanded[nkey(n)] = true; renderTree(); }
    else go(i + 1, 1);
    ev.preventDefault();
  } else if (k === 'ArrowLeft' && n) {
    if (n.children && n.children.length && state.expanded[nkey(n)]) { state.expanded[nkey(n)] = false; renderTree(); }
    else { var p = parentOf(i); if (p >= 0) select(state.rows[p].n); }
    ev.preventDefault();
  }
}

// ---------- selection / styles ----------
function select(n){
  state.sel = { h: n.h, path: n.path || null };
  state.askAbout = null;
  state.suggest = Object.create(null);
  renderTree(); scrollSelIntoView();
  loadStyles();
}
function loadStyles(){
  var pane = $('stylesPane');
  if (!state.sel) { clear(pane); pane.appendChild(el('div', 'empty', 'Select a node in the tree, or use “Pick in app”.')); renderAsk(); return Promise.resolve(); }
  var p = { h: state.sel.h, path: state.sel.path };
  var want = state.sel;
  return Promise.all([
    api('/api/styles', p).then(function(j){ return { ok: j }; }, function(e){ return { err: e }; }),
    api('/api/layout', p).then(function(j){ return j; }, function(){ return null; })
  ]).then(function(res){
    if (want !== state.sel) return;
    if (res[0].err) { state.styles = null; paneError(pane, res[0].err); return; }
    showBanner(null);
    state.styles = res[0].ok; state.layout = res[1];
    renderStyles(); renderAsk();
    if (state.styles.edit && !state.scratch) return loadScratch().then(renderStyles);
  });
}
function reloadAll(){
  return loadTree().then(loadStyles);
}

function matches(s){ return !state.filter || String(s == null ? '' : s).toLowerCase().indexOf(state.filter) >= 0; }

function originLabel(o){
  switch (String(o || '').toUpperCase()) {
    case 'USER_AGENT': return 'user agent';
    case 'AUTHOR': return 'author';
    case 'INLINE': return 'inline';
    case 'USER': return 'code';
    default: return String(o || '').toLowerCase();
  }
}
function safeEditorUrl(tpl, file, line){
  if (!tpl || !file) return null;
  var u = String(tpl).split('{file}').join(encodeURIComponent(file)).split('{line}').join(encodeURIComponent(line == null ? '' : line));
  if (/^\s*(javascript|data|vbscript):/i.test(u)) return null;
  return u;
}
/** A long absolute path (a mapped library source) as "…/last/three/parts"; project-relative paths stay as they are. */
function shortPath(f){
  var s = String(f);
  if (s.length <= 48 || !/^([a-zA-Z]:)?[\/\\]/.test(s)) return s;
  var parts = s.split(/[\/\\]/);
  return parts.length > 3 ? '…/' + parts.slice(-3).join('/') : s;
}
function locLink(obj, d){
  if (!obj || !obj.file) return null;
  var wrap = el('span');
  var txt = obj.file + (obj.line != null ? ':' + obj.line : '');
  var a = el('span', 'loc', shortPath(obj.file) + (obj.line != null ? ':' + obj.line : ''));
  a.title = (a.textContent !== txt ? txt + '\n' : '') + 'Click to copy';
  a.addEventListener('click', function(){ copy(txt, 'Copied ' + txt); });
  wrap.appendChild(a);
  var url = safeEditorUrl(d.editorUrl, obj.absFile || obj.file, obj.line);
  if (url) {
    var ide = el('a', 'ide', '↗ open in IDE'); ide.href = url; ide.title = 'Open in IDE'; ide.rel = 'noopener';
    wrap.appendChild(ide);
  }
  return wrap;
}
function declValue(text){
  return text ? String(text).replace(/^[^:]*:\s*/, '').replace(/;\s*$/, '').replace(/\s*!important\s*$/i, '') : '';
}
function declEl(dc, r, d){
  var line = el('div', 'decl' + (dc.status === 'overridden' ? ' overridden' : ''));
  if (dc.reason) line.title = dc.reason;
  var tog = canEdit() && editable(r) ? toggleBox(dc, r, d) : null;
  if (tog) line.appendChild(tog);
  var pn = el('span', 'p askable', dc.property);
  pn.title = 'Ask the agent about this declaration';
  pn.addEventListener('click', function(){
    state.askAbout = { property: dc.property, selector: r.selector || null, file: r.file || null, line: dc.line != null ? dc.line : (r.line != null ? r.line : null) };
    renderAsk(); $('askText').focus();
  });
  line.appendChild(pn);
  line.appendChild(document.createTextNode(': '));
  var v = dc.text ? String(dc.text).replace(/^[^:]*:\s*/, '').replace(/;\s*$/, '') : '';
  var imp = !!dc.important;
  if (/\s*!important\s*$/i.test(v)) { v = v.replace(/\s*!important\s*$/i, ''); imp = true; }
  var vs = el('span', 'v');
  var live = canEdit() && editable(r);
  if (!live && canEdit() && r.ruleId === 'inline') {
    overrideValue(vs, { cssProperty: dc.property, winner: (propOf(d, dc.property) || {}).winner || { origin: 'INLINE' } }, d, v);
  } else valueWithSwatches(vs, v, live ? function(i){ startEdit(vs, dc, r, d, v, imp, i); } : null);
  line.appendChild(vs);
  if (live) {
    vs.classList.add('editable'); vs.title = 'Click to edit (applies as scratch CSS): ↑/↓ change numbers, Ctrl+Space suggests'; vs.tabIndex = 0;
    var start = function(){ startEdit(vs, dc, r, d, v, imp); };
    vs.addEventListener('click', start);
    vs.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); start(); } });
  }
  if (imp) { line.appendChild(document.createTextNode(' ')); line.appendChild(el('span', 'imp', '!important')); }
  line.appendChild(document.createTextNode(';'));
  if (dc.status === 'overridden' && dc.reason) line.appendChild(el('span', 'why', '— ' + dc.reason));
  if (canEdit() && r.scratch) {
    var x = el('button', 'x', '×'); x.title = 'Remove from scratch CSS'; x.setAttribute('aria-label', 'Remove ' + dc.property);
    x.addEventListener('click', function(){ applyScratch(withoutDecl(scratchItems(), scratchSelector(r), dc.property)); });
    line.appendChild(x);
  }
  return line;
}
function ruleEl(r, d){
  var box = el('div', 'rule' + (r.scratch ? ' scratch-rule' : ''));
  var hd = el('div', 'hd');
  hd.appendChild(el('span', 'sel-t mono', r.selector));
  if (r.specificity) hd.appendChild(el('span', 'spec', r.specificity));
  hd.appendChild(el('span', 'org', originLabel(r.origin)));
  var l = locLink(r, d); if (l) hd.appendChild(l);
  var ext = externalChip(r, d); if (ext) hd.appendChild(ext);
  if (canEdit() && editable(r)) {
    var add = el('button', 'addb', '+'); add.title = 'Add a declaration to ' + r.selector; add.setAttribute('aria-label', add.title);
    add.addEventListener('click', function(){ if (!box.querySelector('.adddecl')) box.appendChild(addDeclRow(r, d)); });
    hd.appendChild(add);
  }
  box.appendChild(hd);
  if (r.ruleId === 'inline') {
    box.appendChild(el('div', 'note', 'setStyle(…) in code or style="…" in FXML: beats every stylesheet rule unless the rule is !important.' +
      (canEdit() ? ' Click a value to try an !important override for ' + scopeSelector(d) + '.' : '')));
  }
  if (state.mapping && state.mapping.anchor === 'rule:' + r.ruleId && canEdit()) box.appendChild(mapForm());
  var shown = 0;
  (r.declarations || []).forEach(function(dc){
    if (state.filter && !matches(dc.property) && !matches(dc.text)) return;
    box.appendChild(declEl(dc, r, d)); shown++;
  });
  if (state.filter && !shown && !matches(r.selector)) return null;
  return box;
}

function renderStyles(){
  if (state.editing) { state.renderPending = true; return; }
  state.renderPending = false;
  var pane = $('stylesPane'), top = pane.scrollTop, d = state.styles;
  clear(pane);
  if (!d) return;
  var hd = el('div'); hd.id = 'stHead';
  var t = d.target || {};
  hd.appendChild(el('div', 'sum mono', (t.type || '?') + (t.fxId ? '#' + t.fxId : '')));
  if (t.path) hd.appendChild(el('div', 'inl mono', t.path));
  var chips = el('div', 'chips');
  String(d.styleClass || '').split(/\s+/).filter(Boolean).forEach(function(c){ chips.appendChild(el('span', 'chip', '.' + c)); });
  (d.pseudoClasses || []).forEach(function(c){ chips.appendChild(el('span', 'chip ps', ':' + c)); });
  if (chips.firstChild) hd.appendChild(chips);
  if (d.inlineStyle) hd.appendChild(el('div', 'inl mono', 'style: ' + d.inlineStyle));
  pane.appendChild(hd);

  var tabs = el('div'); tabs.id = 'tabs';
  [['styles', 'Styles'], ['computed', 'Computed']].forEach(function(x){
    var b = el('button', state.tab === x[0] ? 'on' : '', x[1]);
    b.addEventListener('click', function(){ state.tab = x[0]; renderStyles(); });
    tabs.appendChild(b);
  });
  var f = el('input'); f.type = 'search'; f.placeholder = 'Filter'; f.value = state.filter; f.id = 'filter';
  f.addEventListener('input', function(){
    state.filter = f.value.toLowerCase();
    var pos = f.selectionStart; renderStyles();
    var nf = $('filter'); if (nf) { nf.focus(); try { nf.setSelectionRange(pos, pos); } catch(e){} }
  });
  tabs.appendChild(f);
  pane.appendChild(tabs);

  if (state.tab === 'computed') renderComputed(pane, d); else renderRules(pane, d);
  renderBox(pane);
  pane.scrollTop = top;
}

function renderRules(pane, d){
  if (editOn()) renderScratchBar(pane, d);
  var shown = 0;
  var code = codeEl(d); if (code) { pane.appendChild(code); shown++; }
  (d.rules || []).forEach(function(r){ var e = ruleEl(r, d); if (e) { pane.appendChild(e); shown++; } });
  var defaults = (d.properties || []).filter(function(p){ return p.default; });
  var defHits = state.filter ? defaults.filter(function(p){ return matches(p.cssProperty); }) : [];
  if (!shown && !defHits.length) pane.appendChild(el('div', 'empty', state.filter ? 'No matching declarations.' : 'No matching rules.'));
  var groups = Object.create(null), order = [];
  (d.properties || []).forEach(function(p){
    var inh = p.inheritedFrom; if (!inh) return;
    if (!matches(p.cssProperty) && !matches(inh.winner && inh.winner.text)) return;
    var k = inh.path || '?';
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push({ p: p, inh: inh });
  });
  order.forEach(function(k){
    var s = el('div', 'sect', 'Inherited from ');
    s.appendChild(el('span', 'path', k));
    pane.appendChild(s);
    var box = el('div', 'rule');
    groups[k].forEach(function(g){
      var w = g.inh.winner || {};
      var line = el('div', 'decl');
      line.appendChild(el('span', 'p', g.p.cssProperty));
      line.appendChild(document.createTextNode(': '));
      line.appendChild(el('span', 'v', g.p.value != null ? g.p.value : (w.text || '')));
      line.appendChild(document.createTextNode(';'));
      if (w.selector) line.appendChild(el('span', 't-text', w.selector));
      var l = locLink(w, d); if (l) { l.style.marginLeft = '8px'; line.appendChild(l); }
      box.appendChild(line);
    });
    pane.appendChild(box);
  });
  if (defHits.length) {
    pane.appendChild(el('div', 'sect', 'Default values (no stylesheet or code sets them)'));
    var db = el('div', 'rule');
    defHits.forEach(function(p){
      var line = el('div', 'decl'), v = liveCss(p), vs = el('span', 'v');
      line.appendChild(el('span', 'p', p.cssProperty));
      line.appendChild(document.createTextNode(': '));
      if (canEdit() && !isBound(p)) overrideValue(vs, p, d, v); else valueWithSwatches(vs, v, null);
      line.appendChild(vs);
      line.appendChild(document.createTextNode(';'));
      if (p.note) line.appendChild(el('span', 'why', '— ' + String(p.note).split(': ').slice(1).join(': ')));
      line.title = p.note || '';
      db.appendChild(line);
    });
    pane.appendChild(db);
  } else if (!state.filter && defaults.length) {
    var more = el('div', 'moredef', defaults.length + ' more properties keep their default value (no stylesheet or code sets them): ');
    var go = el('button', 'linkb', 'show in Computed');
    go.addEventListener('click', function(){ state.tab = 'computed'; renderStyles(); });
    more.appendChild(go);
    pane.appendChild(more);
  }
  renderBlockers(pane);
}

/**
 * Values set from Java code (setters, bindings), like DevTools' element.style: they are not CSS, so no rule lists
 * them. A matching stylesheet rule overrides a setter's value on the next CSS pass; a bound property cannot be styled.
 */
function codeEl(d){
  var list = (d.properties || []).filter(function(p){
    if (p.cssProperty === '-fx-skin') return false;  // every control sets its skin in code
    return (p.winner && p.winner.ruleId === 'code') || isBound(p) ||
      (p.overridden || []).some(function(o){ return o.ruleId === 'code'; });
  });
  // a composite set in code (setFont) is listed by its parts, so -fx-font-size can be overridden on its own; parts
  // without a CSS spelling (the insets of a setBackground) are left out, the composite stays when none is left
  list = list.filter(function(p){ return !p.of || liveCss(p) !== ''; });
  list = list.filter(function(p){ return !list.some(function(q){ return q.of === p.cssProperty; }); });
  list = list.filter(function(p){ return matches(p.cssProperty) || matches(liveCss(p)); });
  if (!list.length) return null;
  var box = el('div', 'rule code-rule'), hd = el('div', 'hd');
  hd.appendChild(el('span', 'sel-t', 'Set in code'));
  hd.appendChild(el('span', 'org', 'code'));
  box.appendChild(hd);
  box.appendChild(el('div', 'note', 'Setters such as setFont() or setTextFill(), not CSS. Any stylesheet rule that matches this node ' +
    'overrides them, no !important needed; only a bound property cannot be styled.' +
    (canEdit() ? ' Click a value to try an override for ' + scopeSelector(d) + '.' : '')));
  list.forEach(function(p){
    var line = el('div', 'decl'), v = liveCss(p), vs = el('span', 'v'), bound = isBound(p);
    line.appendChild(el('span', 'p', p.cssProperty));
    line.appendChild(document.createTextNode(': '));
    if (canEdit() && !bound) overrideValue(vs, p, d, v); else valueWithSwatches(vs, v, null);
    line.appendChild(vs);
    line.appendChild(document.createTextNode(';'));
    if (bound) line.appendChild(el('span', 'why', '— bound in code: CSS cannot change it'));
    else if (!(p.winner && p.winner.ruleId === 'code')) {
      line.appendChild(el('span', 'why', '— shown now; ' + (p.winner && p.winner.selector ? p.winner.selector : 'a stylesheet rule') +
        ' takes over on the next CSS pass'));
    }
    box.appendChild(line);
  });
  return box;
}

function renderBlockers(pane){
  var items = [];
  (state.styles.properties || []).forEach(function(p){
    if (p.blockers && p.blockers.length && matches(p.cssProperty)) items.push(p);
  });
  if (!items.length) return;
  var box = el('div', 'blk');
  box.appendChild(el('h3', null, 'Blockers'));
  items.forEach(function(p){
    var w = el('div', 'prop');
    w.appendChild(el('strong', 'mono', p.cssProperty));
    p.blockers.forEach(function(b){
      w.appendChild(el('div', 'cause', (b.kind ? '[' + b.kind + '] ' : '') + (b.cause || '')));
      if (b.next) w.appendChild(el('div', 'next', 'Next: ' + b.next));
    });
    var btn = el('button', null, 'Suggest override'); btn.style.marginTop = '4px';
    var out = el('div');
    if (state.suggest[p.cssProperty]) fillSuggest(out, state.suggest[p.cssProperty]);
    btn.addEventListener('click', function(){
      btn.disabled = true; clear(out);
      api('/api/suggest', { h: state.sel.h, path: state.sel.path, property: p.cssProperty }).then(function(j){
        state.suggest[p.cssProperty] = { ok: j }; fillSuggest(out, state.suggest[p.cssProperty]);
      }, function(e){
        state.suggest[p.cssProperty] = { err: e }; fillSuggest(out, state.suggest[p.cssProperty]);
      }).then(function(){ btn.disabled = false; });
    });
    w.appendChild(btn); w.appendChild(out);
    box.appendChild(w);
  });
  pane.appendChild(box);
}
function fillSuggest(out, r){
  clear(out);
  if (r.err) { out.appendChild(el('div', 'err', errText(r.err))); return; }
  var j = r.ok, s = el('div', 'sugg');
  if (j.snippet != null) {
    s.appendChild(el('pre', null, j.snippet));
    var cb = el('button', null, 'Copy'); cb.addEventListener('click', function(){ copy(j.snippet, 'Snippet copied'); });
    s.appendChild(cb);
  }
  if (j.file) s.appendChild(el('div', 't-text', 'in ' + j.file + (j.selector ? '  (' + j.selector + ')' : '')));
  if (j.needsImportant) s.appendChild(el('div', 't-text', 'needs !important'));
  if (j.why) s.appendChild(el('div', null, j.why));
  out.appendChild(s);
}

    apply.title = 'Writes these rules into the stylesheets they came from (preview first)';
    apply.disabled = paused;
    apply.addEventListener('click', previewApply);
    var cp = el('button', null, 'Copy as CSS');
    cp.addEventListener('click', function(){ copy(css, 'Scratch CSS copied'); });
    var ask = el('button', null, 'Ask agent to apply');
    ask.title = 'Copies a prompt for your coding agent';
    ask.addEventListener('click', function(){
      copy('Apply these FXLoop scratch rules to the project\'s stylesheets, then call fx_reload with clearScratch=true:\n\n' + css,
        'Prompt copied: paste it to your agent');
    });
    var clr = el('button', null, 'Clear');
    clr.disabled = paused;
    clr.addEventListener('click', function(){ closePlan(); applyScratch([]); });
    [apply, cp, ask, clr].forEach(function(b){ bar.appendChild(b); });
  }
  box.appendChild(bar);
  if (state.newRule && !paused) box.appendChild(newRuleForm(d));
  if (state.plan && n && !paused) box.appendChild(planEl(state.plan));
  pane.appendChild(box);
}
function closePlan(){ state.plan = null; state.targets = Object.create(null); }
/** Apply to file, step 1: asks where each scratch rule would go (honouring the stylesheets picked so far) and shows it. */
function previewApply(){
  postJson('/api/scratch/apply', { targets: state.targets }, { dryRun: 1 }).then(function(j){
    if ((!j.files || !j.files.length) && !state.plan) { toast('Nothing to change: the files already say this'); return; }
    state.plan = j; renderStyles();
  }, function(e){ toast(errText(e)); });
}
function optionText(o){
  return shortPath(o.file) + (o.external ? ' (library source)' : '') + ' · ' + (o.kind === 'merge' ? 'edit its rule' : 'add as a new rule');
}
/** Per scratch rule: the stylesheet it goes into, any project sheet or mapped library source to choose from. */
function destEl(it){
  var wrap = el('div');
  var row = el('div', 'dest');
  row.appendChild(el('span', 'mono', it.selector));
  row.appendChild(document.createTextNode('→'));
  var sel = el('select', 'mono'); sel.setAttribute('aria-label', 'Stylesheet for ' + it.selector);
  (it.options || []).forEach(function(o){
    var op = el('option', null, optionText(o)); op.value = o.file; op.title = o.file;
    if (o.file === it.file) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener('change', function(){ state.targets[it.n] = sel.value; previewApply(); });
  row.appendChild(sel);
  wrap.appendChild(row);
  (it.unmapped || []).forEach(function(u){
    var h = el('div', 'hint');
    h.appendChild(document.createTextNode(it.selector + ' comes from ' + u.file + (u.from ? ' (' + u.from + ')' : '') +
      ', outside this app. '));
    var b = el('button', 'linkb', 'Map it to its source…');
    b.type = 'button';
    b.addEventListener('click', function(){ openMap({ url: u.url, file: u.file, from: u.from, mappable: true }, 'plan:' + it.n); });
    h.appendChild(b);
    wrap.appendChild(h);
  });
  if (state.mapping && state.mapping.anchor === 'plan:' + it.n) wrap.appendChild(mapForm());
  return wrap;
}
function changeText(c){
  switch (c.kind) {
    case 'update': return c.selector + ' { ' + c.property + ': ' + c.from + ' → ' + c.to + ' }';
    case 'add': return c.selector + ' { + ' + c.property + ': ' + c.to + ' }';
    case 'newRule': return 'new rule ' + c.css;
    default: return JSON.stringify(c);
  }
}
function planEl(plan){
  var box = el('div', 'plan');
  var choice = (plan.items || []).some(function(it){ return (it.options || []).length > 1 || (it.unmapped || []).length; });
  if (choice) {
    box.appendChild(el('div', null, 'Where each rule goes:'));
    plan.items.forEach(function(it){ box.appendChild(destEl(it)); });
  }
  if (!plan.files.length) {
    box.appendChild(el('div', 'hint', 'Nothing to change: the files already say this.'));
  } else box.appendChild(el('div', choice ? 'f' : null, 'Write these changes to your files?'));
  plan.files.forEach(function(f){
    var fh = el('div', 'f mono', f.file);
    if (f.external) fh.appendChild(el('span', 'lib', '  library source'));
    box.appendChild(fh);
    if (f.external && f.live === false) {
      box.appendChild(el('div', 'hint', 'The app loads this stylesheet from ' + (f.from || 'a jar') + ': it keeps showing these rules ' +
        'from scratch CSS until the library is rebuilt and the app restarted.'));
    }
    (f.changes || []).forEach(function(c){
      var line = el('div', 'c mono');
      line.appendChild(el('span', 'k', c.line != null ? 'line ' + c.line : ''));
      line.appendChild(document.createTextNode(changeText(c)));
      box.appendChild(line);
    });
  });
  var bar = el('div', 'chips');
  var ok = el('button', null, 'Write to file' + (plan.files.length === 1 ? '' : 's'));
  ok.disabled = !plan.files.length;
  ok.addEventListener('click', function(){
    ok.disabled = true;
    postJson('/api/scratch/apply', { targets: state.targets }).then(function(j){
      closePlan();
      state.scratch = j.scratch && j.scratch.active ? j.scratch : { active: false, rules: 0 };
      if (!state.scratch.active) state.disabled = Object.create(null);
      var kept = state.scratch.active ? '; ' + state.scratch.rules + ' rule' + (state.scratch.rules === 1 ? '' : 's') +
        ' stay in scratch CSS until the library is rebuilt' : '';
      toast('Applied to ' + j.files.map(function(f){ return f.file; }).join(', ') + kept);
      loadStyles();
    }, function(e){ ok.disabled = false; toast(errText(e)); });
  });
  var cancel = el('button', null, 'Cancel');
  cancel.addEventListener('click', function(){ closePlan(); state.mapping = null; renderStyles(); });
  bar.appendChild(ok); bar.appendChild(cancel);
  box.appendChild(bar);
  return box;
}

function renderComputed(pane, d){
  var all = d.properties || [];
  var nd = all.filter(function(p){ return p.default; }).length;
  if (nd) {
    var bar = el('label', 'cbar'), cb = el('input');
    cb.type = 'checkbox'; cb.checked = state.showDefaults;
    cb.addEventListener('change', function(){
      state.showDefaults = cb.checked;
      try { localStorage.setItem(DEFAULTS_KEY, cb.checked ? '1' : '0'); } catch(e){}
      renderStyles();
    });
    bar.appendChild(cb);
    bar.appendChild(document.createTextNode('Show defaults: ' + nd + (nd === 1 ? ' property' : ' properties') + ' no stylesheet or code sets'));
    pane.appendChild(bar);
  }
  var tbl = el('table'), thead = el('tr');
  ['Property', 'Value', 'Set by'].forEach(function(h){ thead.appendChild(el('th', null, h)); });
  tbl.appendChild(thead);
  var n = 0;
  all.forEach(function(p){
    if (p.default && !state.showDefaults) return;
    var v = liveCss(p);
    if (!matches(p.cssProperty) && !matches(v)) return;
    var tr = el('tr', (p.simulation === 'mismatch' ? 'mismatch' : '') + (p.default ? ' dflt' : ''));
    tr.appendChild(el('td', 'mono', p.cssProperty));
    var td = el('td', 'mono'), vs = el('span', 'v');
    if (p.simulation === 'mismatch') {
      var sim = p.simulatedValue != null ? p.simulatedValue : (p.simulated && p.simulated.value != null ? p.simulated.value : null);
      vs.textContent = sim != null ? 'actual ' + v + '  ≠  simulated ' + sim : v;
      tr.title = (p.simulated && p.simulated.note) || 'the reconstructed cascade disagrees with the live value';
    } else if (canEdit() && !isBound(p)) overrideValue(vs, p, d, v);
    else valueWithSwatches(vs, v, null);
    td.appendChild(vs);
    tr.appendChild(td);
    tr.appendChild(setByCell(p, d));
    tbl.appendChild(tr); n++;
  });
  if (!n) pane.appendChild(el('div', 'empty', 'No matching properties.'));
  else pane.appendChild(tbl);
}
/** Where a computed value comes from: the winning rule, code, an ancestor, or nothing (the initial value). */
function setByCell(p, d){
  var td = el('td', 'src'), w = p.winner;
  if (p.default) {
    td.appendChild(el('span', 'org', 'default'));
    // notes read "why: what", e.g. "no stylesheet or code sets it: JavaFX uses the system default font (…)"
    var what = String(p.note || '').split(': ').slice(1).join(': ');
    if (what) td.appendChild(el('span', 't-text', what));
    td.title = p.note || '';
  } else if (w && w.ruleId === 'code') {
    td.appendChild(el('span', 'org', isBound(p) ? 'bound in code' : 'set in code'));
  } else if (w) {
    td.appendChild(el('span', 'org', originLabel(w.origin)));
    td.appendChild(el('span', 'mono', w.ruleId === 'inline' ? 'style' : w.selector));
    var l = locLink(w, d); if (l) { l.style.marginLeft = '8px'; td.appendChild(l); }
  } else if (p.inheritedFrom) {
    var iw = p.inheritedFrom.winner || {};
    td.appendChild(el('span', 'org', 'inherited'));
    td.appendChild(el('span', 'mono', String(p.inheritedFrom.path || '').split('/').pop() + (iw.selector ? ' ' + iw.selector : '')));
    td.title = 'inherited from ' + (p.inheritedFrom.path || '?');
  } else {
    td.appendChild(el('span', 'org', originLabel(p.origin)));
    // a composite (-fx-font) no rule sets as a whole takes its origin from the parts that are set
    var parts = (d.properties || []).filter(function(q){ return q.of === p.cssProperty && q.winner; }).map(function(q){ return q.cssProperty; });
    if (parts.length) td.appendChild(el('span', 't-text', 'through ' + parts.join(', ')));
  }
  return td;
}

// box model
function parseInsets(s){
  if (s == null) return null;
  if (typeof s === 'object') return [s.top, s.right, s.bottom, s.left];
  var a = String(s).trim().split(/\s+/);
  return a.length === 4 ? a : null;
}
function renderBox(pane){
  var L = state.layout;
  if (!L || !L.layoutBounds) return;
  var box = el('div'); box.id = 'box';
  var pad = parseInsets(L.padding), ins = parseInsets(L.insets);
  function layer(cls, name, vals, inner){
    var d = el('div', 'mb ' + cls);
    d.appendChild(el('span', 'lab', name));
    d.appendChild(el('div', null, vals[0]));
    var mid = el('div');
    mid.style.display = 'flex'; mid.style.alignItems = 'center'; mid.style.gap = '6px';
    mid.appendChild(el('span', null, vals[3]));
    var c = el('div'); c.style.flex = '1'; c.appendChild(inner); mid.appendChild(c);
    mid.appendChild(el('span', null, vals[1]));
    d.appendChild(mid);
    d.appendChild(el('div', null, vals[2]));
    return d;
  }
  var inner = el('div', 'mb c', L.layoutBounds.w + ' × ' + L.layoutBounds.h);
  if (pad) inner = layer('p', 'padding', pad, inner);
  if (ins && (!pad || ins.join() !== pad.join())) inner = layer('b', 'insets', ins, inner);
  box.appendChild(el('div', 'sect', 'Box model'));
  box.lastChild.style.margin = '-10px -10px 8px';
  box.appendChild(inner);
  pane.appendChild(box);
}

// ---------- SSE ----------
var flashTimer;
function flash(){
  var u = $('updated'); u.classList.add('flash');
  clearTimeout(flashTimer); flashTimer = setTimeout(function(){ u.classList.remove('flash'); }, 1200);
}
function connect(){
  if (typeof EventSource === 'undefined') return;
  var es = new EventSource('/sse?t=' + encodeURIComponent(TOKEN) + '&from=inspect');
  es.onopen = function(){ $('dot').className = 'on'; $('stxt').textContent = 'server connected'; };
  es.onerror = function(){ $('dot').className = ''; $('stxt').textContent = 'server disconnected'; };
  es.addEventListener('reload', function(){ flash(); reloadAll(); });
  es.addEventListener('status', function(ev){
    var s; try { s = JSON.parse(ev.data); } catch(e){ return; }
    var was = !!state.lock;
    state.lock = s.lock || null;
    state.activity = s.activity || '';
    renderLock();
    if (was !== !!state.lock) { closePlan(); renderStyles(); }
  });
  es.addEventListener('status', retryApp);
  es.addEventListener('sheetMap', function(){ if (!state.editing) loadStyles(); });
  es.addEventListener('scratch', function(ev){
    var j; try { j = JSON.parse(ev.data); } catch(e){ return; }
    var was = state.scratch && state.scratch.css, now = j && j.css;
    state.scratch = j;
    if (!j.active) state.disabled = Object.create(null);
    if (was !== now) loadStyles();
  });
  es.addEventListener('moved', function(ev){
    var j; try { j = JSON.parse(ev.data); } catch(e){ return; }
    if (!j.url || j.url.indexOf(location.origin + '/') === 0 || !/^http:\/\/127\.0\.0\.1:\d+\/inspect\?/.test(j.url)) return;
    // An agent session has the app: continue in its inspector (same node), where Ask agent reaches the listening agent.
    var u = j.url + '&window=' + state.win;
    if (state.sel && state.sel.path) u += '&path=' + encodeURIComponent(state.sel.path);
    var b = $('banner'); b.textContent = 'An agent session has the app — switching to its inspector…'; b.style.display = 'block';
    setTimeout(function(){ location.replace(u); }, 600);
  });
  es.addEventListener('prompts', function(ev){
    var j; try { j = JSON.parse(ev.data); } catch(e){ return; }
    state.prompts = j; renderPrompts();
  });
  es.addEventListener('pick', function(ev){
    var j; try { j = JSON.parse(ev.data); } catch(e){ return; }
    setPicking(false);
    if (j.window != null && j.window !== state.win) { state.win = j.window; $('win').value = String(j.window); }
    state.sel = { h: j.h != null ? j.h : null, path: j.path || null };
    state.askAbout = null;
    state.suggest = Object.create(null);
    loadTree().then(loadStyles);
  });
}
function renderLock(){
  var lb = $('lockbar'), locked = !!state.lock;
  $('agent').textContent = state.activity ? 'Agent: ' + state.activity : '';
  lb.style.display = locked ? 'flex' : 'none';
  if (locked) {
    $('locktxt').textContent = 'Agent is driving the app — you\'re watching' +
      (state.lock.reason ? ' (' + state.lock.reason + ')' : '') + '. Editing and picking are paused.';
  }
  $('pick').disabled = locked;
}
function setPicking(on){
  state.picking = on;
  $('hint').textContent = on ? 'Click a node in the app… (Esc cancels)' : '';
}

// ---------- Ask agent ----------
function renderAsk(){
  var c = $('askCtx'); clear(c);
  var t = (state.styles && state.styles.target) || null;
  if (!state.sel) { c.textContent = 'No node selected — the prompt goes without node context'; return; }
  c.appendChild(document.createTextNode('About: '));
  c.appendChild(el('span', 'mono', t ? (t.type || '?') + (t.fxId ? '#' + t.fxId : '') : (state.sel.path || 'node')));
  var a = state.askAbout;
  if (a) {
    c.appendChild(document.createTextNode(' · '));
    c.appendChild(el('span', 'mono about', a.property + (a.selector ? ' in ' + a.selector : '')));
    var x = el('button', 'x', '×'); x.title = 'Ask about the whole node'; x.setAttribute('aria-label', x.title);
    x.addEventListener('click', function(){ state.askAbout = null; renderAsk(); });
    c.appendChild(x);
  }
  c.title = (t && t.path) || state.sel.path || '';
}
function renderPrompts(){
  var j = state.prompts || { listening: false, items: [] };
  var l = $('askListen');
  l.textContent = j.listening ? '● agent listening' : '○ no agent listening — prompts wait in the queue';
  l.className = j.listening ? 'on' : '';
  var log = $('askLog'), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  clear(log);
  (j.items || []).filter(function(p){ return p.status !== 'cancelled'; }).slice(-20).forEach(function(p){
    var box = el('div', 'pm');
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'st ' + p.status, p.status === 'taken' ? 'agent working' : p.status));
    var on = p.context && (p.context.fxId ? (p.context.type || '') + '#' + p.context.fxId : p.context.type || p.context.path);
    if (on) meta.appendChild(el('span', 'mono', on + (p.context.property ? ' · ' + p.context.property : '')));
    if (p.status === 'pending') {
      var x = el('button', 'x', 'withdraw'); x.title = 'Withdraw this prompt before an agent takes it';
      x.addEventListener('click', function(){ api('/api/prompt/cancel', { id: p.id }, 'POST').catch(function(e){ toast(errText(e)); }); });
      meta.appendChild(x);
    }
    box.appendChild(meta);
    box.appendChild(el('div', 'q', p.text));
    (p.replies || []).forEach(function(r, i){
      var last = i === p.replies.length - 1;
      box.appendChild(el('div', 'a' + (last && p.status === 'answered' ? '' : ' note'), r.text));
    });
    log.appendChild(box);
  });
  if (atEnd) log.scrollTop = log.scrollHeight;
}
function loadPrompts(){
  return api('/api/prompts', {}).then(function(j){ state.prompts = j; renderPrompts(); }, function(){ $('ask').style.display = 'none'; });
}
function sendPrompt(){
  var ta = $('askText'), text = ta.value.trim();
  if (!text) return;
  var t = (state.styles && state.styles.target) || {}, a = state.askAbout || {};
  var body = { text: text, window: state.win, tab: state.tab };
  if (state.sel) { if (state.sel.h != null) body.h = state.sel.h; body.path = t.path || state.sel.path || undefined; }
  if (t.type) body.type = t.type;
  if (t.fxId) body.fxId = t.fxId;
  ['property', 'selector', 'file', 'line'].forEach(function(k){ if (a[k] != null) body[k] = a[k]; });
  $('askSend').disabled = true;
  fetch('/api/prompt?t=' + encodeURIComponent(TOKEN), {
    method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(asJson).then(function(){ ta.value = ''; }, function(e){ toast(errText(e)); })
    .then(function(){ $('askSend').disabled = false; });
}
$('askForm').addEventListener('submit', function(ev){ ev.preventDefault(); sendPrompt(); });
$('askText').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); sendPrompt(); }
});

// ---------- wiring ----------
$('pick').addEventListener('click', function(){
  setPicking(true);
  api('/api/pick', { window: state.win }, 'POST').catch(function(e){ setPicking(false); showBanner(e); toast(errText(e)); });
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && state.picking) {
    setPicking(false);
    api('/api/pick', { window: state.win, cancel: 1 }, 'POST').catch(function(){});
  }
});
$('takeover').addEventListener('click', function(){
  api('/api/lock/release', {}, 'POST').then(function(){ state.lock = null; renderLock(); renderStyles(); }, function(e){ toast(errText(e)); });
});
$('skin').addEventListener('change', function(){ state.skin = this.checked; loadTree(); });
$('win').addEventListener('change', function(){
  state.win = parseInt(this.value, 10) || 0; state.sel = null; state.styles = null;
  loadTree().then(loadStyles);
});
$('treePane').addEventListener('keydown', onKey);
$('treePane').addEventListener('mouseleave', clearHighlight);

(function(){
  var sp = $('split'), dragging = false;
  sp.addEventListener('mousedown', function(ev){ dragging = true; ev.preventDefault(); });
  window.addEventListener('mouseup', function(){ dragging = false; });
  window.addEventListener('mousemove', function(ev){
    if (!dragging) return;
    var w = Math.max(160, Math.min(ev.clientX, window.innerWidth - 220));
    $('treePane').style.width = w + 'px';
  });
})();

loadWindows().then(loadTree).then(loadStyles);
renderAsk(); loadPrompts();
connect();
})();
</script>
</body>
