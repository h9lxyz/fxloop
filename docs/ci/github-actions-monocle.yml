# FXLoop in CI headless via OpenJFX Monocle: no X server, fastest lane. Supported JavaFX lines: see docs/ci/monocle.md.
# Copy to .github/workflows/ui-tests-monocle.yml in your JavaFX project.
name: UI tests (Monocle)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Your pom needs org.testfx:openjfx-monocle (test scope) matching your JavaFX line, e.g. 21.0.2 for JavaFX 21.
      - run: ./mvnw -B verify -Dtestfx.headless=true -Dglass.platform=Monocle -Dmonocle.platform=Headless -Dprism.order=sw -Dprism.text=t2k -Djava.awt.headless=true
        shell: bash
      # With the FXLoop MCP server use FXLOOP_HEADLESS=monocle instead (it sets these properties for the app).
