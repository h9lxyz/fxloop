version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    # The JavaFX 21 compile baseline is deliberate (the oldest JavaFX FXLoop supports); CI tests on 27. Patch bumps only.
    ignore:
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.testfx:openjfx-monocle"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: "/fxloop-gradle-plugin"
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: "/sample-apps/fxloop-sample-app-gradle"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
