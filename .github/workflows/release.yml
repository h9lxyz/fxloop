name: Release

# Push a tag like 0.0.1: the version comes from the tag at build time and nothing is committed (PRD 10).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the history and the previous tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: gradle/actions/setup-gradle@v6

      - name: Set the version (in this checkout only)
        run: ./mvnw -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # The server jar bundles the Gradle plugin (plugin-free Gradle prepare, PRD 11 4.2), and Gradle builds it:
      # install the Maven modules it depends on, publish the plugin to mavenLocal, then rebuild the server with it.
      # CI already tested this commit on push; the release does not test again.
      - name: Build order (Maven libs -> Gradle plugin -> server)
        run: |
          ./mvnw -B -DskipTests install
          ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin -PfxloopVersion="$VERSION" publishToMavenLocal
          ./mvnw -B -q -DskipTests install -pl fxloop-server

      - name: Collect the assets
        run: |
          mkdir dist
          cp "fxloop-server/target/fxloop-server-$VERSION-all.jar" dist/
          cp "dist/fxloop-server-$VERSION-all.jar" dist/fxloop-server-all.jar
          skills="$RUNNER_TEMP/skills"
          cp -r fxloop-skills/skills "$skills"
          sed -i "s/^  fxloop-version: .*/  fxloop-version: $VERSION/" "$skills/fxloop-connect/SKILL.md"
          (cd "$skills" && zip -qr "$GITHUB_WORKSPACE/dist/fxloop-skills-$VERSION.zip" .)
          cp "dist/fxloop-skills-$VERSION.zip" dist/fxloop-skills.zip
          (cd dist && sha256sum -- * > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS)

      - name: Release notes
        run: bash .github/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
