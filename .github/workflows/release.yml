name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - uses: gradle/actions/setup-gradle@v6

      # The server jar bundles the Gradle plugin (plugin-free Gradle prepare, PRD 11 4.2), and Gradle builds it:
      # install the Maven modules it depends on, publish the plugin to mavenLocal, and only then run the real
      # deploy, which rebuilds fxloop-server with the plugin jar inside.
      - name: Build order (Maven libs -> Gradle plugin -> server)
        run: |
          ./mvnw -B install -DskipTests
          ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin publishToMavenLocal

      # Requires publishing configuration (distributionManagement or a central publishing plugin) in the POMs.
      - name: Maven deploy (signed, sources, javadoc, SBOM)
        run: ./mvnw -B -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish Gradle plugin
        run: ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            fxloop-server/target/fxloop-server-*-all.jar
            **/target/bom.json
