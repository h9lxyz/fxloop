name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }}, JavaFX ${{ matrix.javafx || '21' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Latest JDK/JavaFX on every OS, so removed or sealed API shows up here (JavaFX 27 needs JDK 25+).
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [25]
        javafx: [27.0.1]
        # Floor: releases compile against JavaFX 21 (provided scope) with --release 17; one Linux lane is enough.
        include:
          - { os: ubuntu-latest, java: 17, javafx: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Sample/gauntlet apps (profile `samples`) run their tests headless on Monocle (no display needed).
      # On newer JavaFX the agent's tests are skipped here; the next step runs them on what users run.
      - run: ./mvnw -B -Psamples install ${{ matrix.javafx && format('-Djavafx.version={0} -Dfxloop.agent.skipTests=true', matrix.javafx) || '' }}
        shell: bash
      # What users run: the agent compiled against JavaFX 21, tested on the newer runtime.
      - name: agent built for JavaFX 21, tested on JavaFX ${{ matrix.javafx }}
        if: matrix.javafx
        run: |
          ./mvnw -B -pl fxloop-agent clean test-compile
          ./mvnw -B -pl fxloop-agent surefire:test -Djavafx.version=${{ matrix.javafx }}
        shell: bash

  acceptance:
    name: acceptance (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: gradle/actions/setup-gradle@v6
      - run: ./mvnw -B install -DskipTests
      # The Gradle and Kotlin lane tests resolve the dev.fxloop plugin from mavenLocal.
      - run: ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin publishToMavenLocal
      # Rebuild the server so it bundles the Gradle plugin just published (plugin-free Gradle prepare, PRD 11 4.2).
      - run: ./mvnw -B -q install -DskipTests -pl fxloop-server
      - run: ./mvnw -B -Pacceptance verify -pl fxloop-acceptance  # the harness starts its own xvfb-run per launch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: acceptance-reports
          path: |
            fxloop-acceptance/target/surefire-reports
            fxloop-acceptance/target/failsafe-reports
          if-no-files-found: ignore

  gradle:
    name: gradle plugin + sample
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: gradle/actions/setup-gradle@v6
      - run: ./mvnw -B install -DskipTests
      - run: ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin build publishToMavenLocal
      - run: sample-apps/fxloop-sample-app-gradle/gradlew -p sample-apps/fxloop-sample-app-gradle test fxloopPrepare
      - run: sample-apps/fxloop-sample-app-kotlin/gradlew -p sample-apps/fxloop-sample-app-kotlin test fxloopPrepare
