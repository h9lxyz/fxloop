name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }}, JavaFX ${{ matrix.javafx || '21' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
        # Releases compile against JavaFX 21 (provided scope); these lanes build and test against newer
        # JavaFX so removed or sealed API shows up here (JavaFX 25 needs JDK 23+, 27 needs JDK 25+).
        include:
          - { os: ubuntu-latest, java: 25, javafx: 25.0.5 }
          - { os: macos-latest, java: 25, javafx: 25.0.5 }
          - { os: windows-latest, java: 25, javafx: 25.0.5 }
          - { os: ubuntu-latest, java: 25, javafx: 27.0.1 }
          - { os: macos-latest, java: 25, javafx: 27.0.1 }
          - { os: windows-latest, java: 25, javafx: 27.0.1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Sample/gauntlet apps (profile `samples`) run their tests headless on Monocle (no display needed).
      - run: ./mvnw -B -Psamples install ${{ matrix.javafx && format('-Djavafx.version={0}', matrix.javafx) || '' }}
        shell: bash
      # What users run: the agent compiled against JavaFX 21, tested on the newer runtime.
      - name: agent built for JavaFX 21, tested on JavaFX ${{ matrix.javafx }}
        if: matrix.javafx
        run: |
          ./mvnw -B -pl fxloop-agent clean test-compile
          ./mvnw -B -pl fxloop-agent surefire:test -Djavafx.version=${{ matrix.javafx }}
        shell: bash

  acceptance:
    name: acceptance (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: ./mvnw -B install -DskipTests
      - run: ./mvnw -B -Pacceptance verify -pl fxloop-acceptance  # the harness starts its own xvfb-run per launch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: acceptance-reports
          path: |
            fxloop-acceptance/target/surefire-reports
            fxloop-acceptance/target/failsafe-reports
          if-no-files-found: ignore

  gradle:
    name: gradle plugin + sample
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: gradle/actions/setup-gradle@v6
      - run: ./mvnw -B install -DskipTests
      - run: ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin build publishToMavenLocal
      - run: sample-apps/fxloop-sample-app-gradle/gradlew -p sample-apps/fxloop-sample-app-gradle test fxloopPrepare
      - run: sample-apps/fxloop-sample-app-kotlin/gradlew -p sample-apps/fxloop-sample-app-kotlin test fxloopPrepare
