name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newest JavaFX, which needs JDK 25+. The gradle job's plain build keeps the release floor compiling: JDK 21, --release 17, JavaFX 21.
  JAVAFX: 27.0.1

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # The agent's suite runs on Monocle, so it never reaches macOS's window system, and takes four times as long there.
          # Linux and Windows run it; macOS still runs every other module, where paths and process launching differ.
          - os: macos-latest
            skip-agent-tests: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # What users run: everything built as released (against JavaFX 21), tested on the newest JavaFX.
      # Sample/gauntlet apps (profile `samples`) run their tests headless on Monocle (no display needed).
      - run: ./mvnw -B -Psamples install -DskipTests
        shell: bash
      - run: ./mvnw -B -Psamples surefire:test -Djavafx.version=$JAVAFX -Dfxloop.agent.skipTests=${{ matrix.skip-agent-tests || false }}
        shell: bash
      # Removed or sealed API shows up here; the compilers see the same API on every OS, so one is enough.
      # `package`, not `test-compile`: the server bundles the packaged agent jar.
      - name: compile against JavaFX ${{ env.JAVAFX }}
        if: runner.os == 'Linux'
        run: ./mvnw -B -Psamples clean package -DskipTests -Djavafx.version=$JAVAFX

  acceptance:
    name: acceptance ${{ matrix.shard }}/2 (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two jobs of about 3 minutes of tests each, not surefire forks: the leak guard after each class sees every app of its
        # run, and these tests are timing-sensitive. The second one is "all the rest", so a new test class cannot fall through.
        include:
          - { shard: 1, tests: 'KotlinLaneTest,LiveDevAcceptanceTest,PluginFreePrepareTest,GradleLaneTest' }
          - { shard: 2, tests: '!KotlinLaneTest,!LiveDevAcceptanceTest,!PluginFreePrepareTest,!GradleLaneTest' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: gradle/actions/setup-gradle@v6
      # The Gradle and Kotlin lane tests resolve the dev.fxloop plugin from mavenLocal, and the server bundles it
      # (plugin-free Gradle prepare, PRD 11 4.2), so: what the plugin depends on, the plugin, then everything else.
      - run: ./mvnw -B -q install -DskipTests -pl fxloop-protocol,fxloop-launch -am
      - run: ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin publishToMavenLocal
      - run: ./mvnw -B install -DskipTests
      # The harness starts its own xvfb-run per launch. MAVEN_ARGS also reaches the mvnw builds of the sample apps it launches.
      - run: ./mvnw -B -Pacceptance verify -pl fxloop-acceptance '-Dtest=${{ matrix.tests }}'
        env:
          MAVEN_ARGS: -Djavafx.version=${{ env.JAVAFX }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: acceptance-reports-${{ matrix.shard }}
          path: |
            fxloop-acceptance/target/surefire-reports
            fxloop-acceptance/target/failsafe-reports
          if-no-files-found: ignore

  gradle:
    name: gradle plugin + sample
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: gradle/actions/setup-gradle@v6
      - run: ./mvnw -B install -DskipTests
      - run: ./fxloop-gradle-plugin/gradlew -p fxloop-gradle-plugin build publishToMavenLocal
      - run: sample-apps/fxloop-sample-app-gradle/gradlew -p sample-apps/fxloop-sample-app-gradle test fxloopPrepare
      - run: sample-apps/fxloop-sample-app-kotlin/gradlew -p sample-apps/fxloop-sample-app-kotlin test fxloopPrepare
